[package]
name = "syan-rust"
description = "Rust AST definitions for syan parser"
version = "0.1.0"
edition = "2021"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
repository = "https://github.com/yasuo-ozu/syan"
keywords = ["macros", "syn", "parser", "proc-macro", "parsing", "rust", "ast"]
categories = [
  "data-structures",
  "rust-patterns",
  "parser-implementations",
]
license = "MIT"

[dependencies]
syan = { path = "../core" }

[dev-dependencies]
quote = "1.0"
proc-macro2 = "1.0"