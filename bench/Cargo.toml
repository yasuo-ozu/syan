[package]
name = "syan-bench"
version = "0.0.0"
edition = "2021"
publish = false
description = "Like-for-like parser benchmarks: nom vs chumsky vs syan"

[dependencies]
syan = { path = "../core" }
nom = "8.0"
chumsky = "0.13"
proc-macro2 = "1.0.107"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "expr"
harness = false
