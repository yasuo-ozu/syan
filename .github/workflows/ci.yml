name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The UI tests compare rustc diagnostics verbatim, so they are skipped here and
  # run on a pinned toolchain in the `ui` job instead of floating with stable.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      - run: >-
          cargo test --workspace --all-features --
          --skip macro_audit_compile_fail
          --skip compile_fail_problems
          --skip visitor_diagnostics
      - run: >-
          cargo test -p syan -p syan-macro --no-default-features --
          --skip macro_audit_compile_fail
          --skip compile_fail_problems
          --skip visitor_diagnostics

  # rustc rewords diagnostics and shortens type paths between releases, so these
  # fixtures are only meaningful on the toolchain they were blessed against.
  # Bumping this pin means re-blessing with TRYBUILD=overwrite.
  ui:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install 1.90.0 --profile minimal --no-self-update
          rustup default 1.90.0
          rustc --version
      - run: >-
          cargo test -p syan --all-features
          --test macro_audit_test --test recurse_core --test visitor_diagnostics

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  doc:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - run: cargo doc --no-deps -p syan -p syan-macro --all-features
