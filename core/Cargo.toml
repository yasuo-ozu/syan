[package]
name = "syan"
description = "Syntactic and structural parser fundamentals, reimplementing syn crate"
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
repository = "https://github.com/yasuo-ozu/syan"
keywords = ["macros", "syn", "parser", "proc-macro", "parsing"]
categories = [
  "data-structures",
  "no-std::no-alloc",
  "rust-patterns",
  "parser-implementations",
]
license = "MIT"
readme = "README.md"

[dependencies]
parametrized = "0.1.8"
newer-type = "0.1.1"
proc-macro2 = { version = "1.0", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
syan-macro = { path = "../macro", version = "0.2.2" }
decycle = "0.5.2"

[dev-dependencies]
template-quote = "0.4"
type-macro-derive-tricks = "0.2"
trybuild = { version = "1.0", features = ["diff"] }
serde_json = "1.0"

[features]
default = ["proc_macro2"]
proc_macro2 = ["dep:proc-macro2"]
serde = ["dep:serde"]

# Build the published docs with every feature on. `serde` is off by default, so without this its
# impls — the whole point of the feature — would be missing from the page a reader lands on.
[package.metadata.docs.rs]
all-features = true
