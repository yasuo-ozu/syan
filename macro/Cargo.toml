[package]
name = "syan-macro"
description = "Syntactic and structural parser fundamentals, reimplementing syn crate"
version = "0.1.0"
edition = "2021"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
repository = "https://github.com/yasuo-ozu/syan"
keywords = ["macros", "syn", "parser", "proc-macro", "parsing"]
categories = [
  "data-structures",
  "no-std::no-alloc",
  "rust-patterns",
  "parser-implementations",
]
license = "MIT"

[lib]
proc-macro = true
path = "lib.rs"

[features]
# Phase-1 recurse-via-decycle Parse backend (build-time global on the proc-macro crate — a proc-macro
# cannot cfg on the consumer's features, so the switch is a macro-crate feature that core's own
# `recurse-decycle` feature forwards to). Off by default: the `#[recurse]` engine path stays
# byte-identical. When on, `#[recurse]` emits the decycle-based cycle-mode `Parse` (a `#[decycle]`
# module + `__ParseDyn` trait) instead of the delegated-engine `Parse`.
recurse-decycle = []

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
template-quote = "0.4"
proc-macro-error = { version = "1.0", default-features = false }
derive-syn-parse = "0.2.0"
type-leak = "0.2.0"
itertools = "0.14.0"
safegraph = { version = "0.1", default-features = false }

[dependencies.syn]
version = "2.0"
features = ["full", "derive", "printing", "extra-traits", "visit", "visit-mut"]
