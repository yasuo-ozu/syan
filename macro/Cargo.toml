[package]
name = "syan-macro"
description = "Syntactic and structural parser fundamentals, reimplementing syn crate"
version = "0.1.0"
edition = "2021"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
repository = "https://github.com/yasuo-ozu/syan"
keywords = ["macros", "syn", "parser", "proc-macro", "parsing"]
categories = [
  "data-structures",
  "no-std::no-alloc",
  "rust-patterns",
  "parser-implementations",
]
license = "MIT"

[lib]
proc-macro = true
path = "lib.rs"

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
template-quote = "0.4"
proc-macro-error = { version = "1.0", default-features = false }
derive-syn-parse = "0.2.0"
type-leak = "0.2.0"
itertools = "0.14.0"
# The public facade, not `decycle-impl`: everything `#[recurse]` needs (`ranked`,
# `analysis`, `safegraph`) is re-exported there, and that is the documented surface.
decycle = "0.5.2"

[dependencies.syn]
version = "2.0"
features = ["full", "derive", "printing", "extra-traits", "visit", "visit-mut"]
